<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7e096" />
      <stop offset="30%" stop-color="#d4af37" />
      <stop offset="70%" stop-color="#aa7c11" />
      <stop offset="100%" stop-color="#6e4f07" />
    </linearGradient>

    <linearGradient id="maroonGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7a1422" />
      <stop offset="50%" stop-color="#540b15" />
      <stop offset="100%" stop-color="#31040a" />
    </linearGradient>

    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#eed891" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#b08b26" />
    </linearGradient>

    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <g filter="url(#dropShadow)">
    <!-- Central Shield -->
    <path d="M 400 160 C 490 160, 520 200, 520 380 C 520 500, 440 560, 400 580 C 360 560, 280 500, 280 380 C 280 200, 310 160, 400 160 Z" 
          fill="url(#maroonGrad)" stroke="url(#goldGrad)" stroke-width="10" />

    <!-- Shield Inner Decorative Border -->
    <path d="M 400 178 C 475 178, 502 212, 502 375 C 502 480, 432 538, 400 556 C 368 538, 298 480, 298 375 C 298 212, 325 178, 400 178 Z" 
          fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-dasharray="8 4" />

    <!-- Shield Ornament Top Crown / Fleur-de-lis -->
    <g transform="translate(400, 115) scale(0.9)">
      <path d="M 0 -35 C 10 -20 25 -10 25 10 C 25 25 10 30 0 30 C -10 30 -25 25 -25 10 C -25 -10 -10 -20 0 -35 Z" fill="url(#goldGrad)" />
      <path d="M 0 10 C 15 5 35 15 35 35 C 20 35 5 25 0 10 Z" fill="url(#goldGrad)" />
      <path d="M 0 10 C -15 5 -35 15 -35 35 C -20 35 -5 25 0 10 Z" fill="url(#goldGrad)" />
      <rect x="-18" y="28" width="36" height="7" rx="3" fill="url(#goldGrad)" />
    </g>

    <!-- Open Book Symbol inside Shield -->
    <g transform="translate(400, 290)">
      <!-- Left Page -->
      <path d="M -5 10 Q -45 -10 -85 0 L -85 -55 Q -45 -65 -5 -45 Z" fill="#fffef5" stroke="url(#goldGrad)" stroke-width="3"/>
      <!-- Right Page -->
      <path d="M 5 10 Q 45 -10 85 0 L 85 -55 Q 45 -65 5 -45 Z" fill="#fffef5" stroke="url(#goldGrad)" stroke-width="3"/>
      <!-- Book Binding & Lines -->
      <path d="M 0 -47 L 0 12" stroke="url(#goldGrad)" stroke-width="4"/>
      <!-- Text Lines Left -->
      <line x1="-75" y1="-42" x2="-15" y2="-32" stroke="#540b15" stroke-width="2.5" />
      <line x1="-75" y1="-28" x2="-15" y2="-18" stroke="#540b15" stroke-width="2.5" />
      <line x1="-75" y1="-14" x2="-15" y2="-4" stroke="#540b15" stroke-width="2.5" />
      <line x1="-75" y1="0" x2="-25" y2="7" stroke="#540b15" stroke-width="2.5" />
      <!-- Text Lines Right -->
      <line x1="15" y1="-32" x2="75" y2="-42" stroke="#540b15" stroke-width="2.5" />
      <line x1="15" y1="-18" x2="75" y2="-28" stroke="#540b15" stroke-width="2.5" />
      <line x1="15" y1="-4" x2="75" y2="-14" stroke="#540b15" stroke-width="2.5" />
      <line x1="25" y1="7" x2="75" y2="0" stroke="#540b15" stroke-width="2.5" />
    </g>

    <!-- Torch of Wisdom inside Shield -->
    <g transform="translate(400, 450)">
      <!-- Flame -->
      <path d="M 0 -45 C 20 -25 15 -10 0 0 C -15 -10 -20 -25 0 -45 Z" fill="#ff9100" />
      <path d="M 0 -35 C 10 -20 8 -8 0 0 C -8 -8 -10 -20 0 -35 Z" fill="#ffe600" />
      <!-- Torch Handle -->
      <path d="M -8 0 L 8 0 L 5 45 L -5 45 Z" fill="url(#goldGrad)" stroke="#31040a" stroke-width="1.5" />
      <rect x="-12" y="-4" width="24" height="6" rx="2" fill="url(#goldGrad)" />
      <!-- Laurel Wreath Around Torch -->
      <path d="M -45 20 C -40 -10 -20 -30 0 -35 M 45 20 C 40 -10 20 -30 0 -35" fill="none" stroke="url(#goldGrad)" stroke-width="3" />
      <circle cx="-35" cy="0" r="4" fill="url(#goldGrad)" />
      <circle cx="-25" cy="-18" r="4" fill="url(#goldGrad)" />
      <circle cx="-12" cy="-28" r="4" fill="url(#goldGrad)" />
      <circle cx="35" cy="0" r="4" fill="url(#goldGrad)" />
      <circle cx="25" cy="-18" r="4" fill="url(#goldGrad)" />
      <circle cx="12" cy="-28" r="4" fill="url(#goldGrad)" />
    </g>

    <!-- Left Heraldic Lion (Supporter) -->
    <g transform="translate(180, 190)">
      <!-- Lion Silhouette with Gold Gradient -->
      <path d="M 80 260 C 70 230 40 210 30 180 C 20 150 40 120 20 90 C 10 75 -5 65 5 40 C 15 20 40 10 60 20 C 75 25 85 45 95 30 C 105 15 110 -5 130 5 C 145 12 140 35 155 45 C 170 55 190 40 180 70 C 170 95 145 110 140 135 C 135 160 155 180 150 210 C 145 240 110 250 100 280 Z" fill="url(#goldGrad)" stroke="#31040a" stroke-width="2" />
      <!-- Lion Mane & Details -->
      <path d="M 60 30 Q 30 50 45 85 Q 15 105 35 140 Q 60 120 75 160" fill="none" stroke="#6e4f07" stroke-width="3" />
      <path d="M 5 40 Q -15 20 -25 45 Q -10 60 10 50" fill="none" stroke="#6e4f07" stroke-width="3" />
      <!-- Paws resting on shield -->
      <path d="M 125 75 C 145 75 165 85 170 105" fill="none" stroke="url(#goldGrad)" stroke-width="12" stroke-linecap="round" />
      <path d="M 115 150 C 135 150 155 160 165 180" fill="none" stroke="url(#goldGrad)" stroke-width="12" stroke-linecap="round" />
      <!-- Tail -->
      <path d="M 30 250 C -20 240 -40 180 -10 130 C 0 115 -10 90 -25 95" fill="none" stroke="url(#goldGrad)" stroke-width="7" stroke-linecap="round" />
      <!-- Tail Tuft -->
      <path d="M -25 95 C -35 80 -15 70 -30 60 C -40 75 -35 95 -25 95 Z" fill="url(#goldGrad)" />
    </g>

    <!-- Right Heraldic Lion (Supporter - Flipped) -->
    <g transform="translate(620, 190) scale(-1, 1)">
      <!-- Lion Silhouette with Gold Gradient -->
      <path d="M 80 260 C 70 230 40 210 30 180 C 20 150 40 120 20 90 C 10 75 -5 65 5 40 C 15 20 40 10 60 20 C 75 25 85 45 95 30 C 105 15 110 -5 130 5 C 145 12 140 35 155 45 C 170 55 190 40 180 70 C 170 95 145 110 140 135 C 135 160 155 180 150 210 C 145 240 110 250 100 280 Z" fill="url(#goldGrad)" stroke="#31040a" stroke-width="2" />
      <!-- Lion Mane & Details -->
      <path d="M 60 30 Q 30 50 45 85 Q 15 105 35 140 Q 60 120 75 160" fill="none" stroke="#6e4f07" stroke-width="3" />
      <path d="M 5 40 Q -15 20 -25 45 Q -10 60 10 50" fill="none" stroke="#6e4f07" stroke-width="3" />
      <!-- Paws resting on shield -->
      <path d="M 125 75 C 145 75 165 85 170 105" fill="none" stroke="url(#goldGrad)" stroke-width="12" stroke-linecap="round" />
      <path d="M 115 150 C 135 150 155 160 165 180" fill="none" stroke="url(#goldGrad)" stroke-width="12" stroke-linecap="round" />
      <!-- Tail -->
      <path d="M 30 250 C -20 240 -40 180 -10 130 C 0 115 -10 90 -25 95" fill="none" stroke="url(#goldGrad)" stroke-width="7" stroke-linecap="round" />
      <!-- Tail Tuft -->
      <path d="M -25 95 C -35 80 -15 70 -30 60 C -40 75 -35 95 -25 95 Z" fill="url(#goldGrad)" />
    </g>

    <!-- Motto Ribbon Banner -->
    <g transform="translate(400, 585)">
      <!-- Banner Background Ribbons -->
      <path d="M -290 20 L -210 -15 L -210 35 Z" fill="#4a0b13" />
      <path d="M 290 20 L 210 -15 L 210 35 Z" fill="#4a0b13" />
      
      <!-- Main Scroll Body -->
      <path d="M -240 15 C -150 -10 150 -10 240 15 C 260 45 220 55 200 45 C 120 25 -120 25 -200 45 C -220 55 -260 45 -240 15 Z" fill="url(#ribbonGrad)" stroke="#540b15" stroke-width="3" />
      
      <!-- Motto Texts -->
      <text x="-140" y="28" font-family="'Cinzel', 'Times New Roman', serif" font-weight="bold" font-size="20" fill="#31040a" letter-spacing="2">VERITAS</text>
      <text x="0" y="32" font-family="'Cinzel', 'Times New Roman', serif" font-weight="bold" font-size="21" fill="#31040a" letter-spacing="2" text-anchor="middle">SAPIENTIA</text>
      <text x="140" y="28" font-family="'Cinzel', 'Times New Roman', serif" font-weight="bold" font-size="20" fill="#31040a" letter-spacing="2" text-anchor="end">VIRTUS</text>
    </g>

    <!-- University Name Typography -->
    <g transform="translate(400, 685)">
      <!-- Top Line: UNIVERSITY OF -->
      <text x="0" y="-20" font-family="'Cinzel', 'Times New Roman', serif" font-size="24" font-weight="600" fill="url(#goldGrad)" letter-spacing="8" text-anchor="middle">UNIVERSITY OF</text>

      <!-- Main Name: EAST FLORIDA -->
      <text x="0" y="35" font-family="'Cinzel', 'Playfair Display', serif" font-size="52" font-weight="900" fill="#ffffff" letter-spacing="4" text-anchor="middle" filter="url(#dropShadow)">EAST FLORIDA</text>

      <!-- Subtitle Badge -->
      <rect x="-180" y="55" width="360" height="3" fill="url(#goldGrad)" />
      <text x="0" y="78" font-family="'Inter', sans-serif" font-size="15" font-weight="600" fill="#d4af37" letter-spacing="5" text-anchor="middle">100% ONLINE GLOBAL UNIVERSITY • USA</text>
    </g>
  </g>
</svg>
